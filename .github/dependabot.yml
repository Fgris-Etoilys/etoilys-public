version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 12
    groups:
      posthog:
        applies-to: version-updates
        patterns:
          - posthog-js
          - '@posthog/react'
        update-types:
          - minor
          - patch
      react-and-routing:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - react-router-dom
        update-types:
          - minor
          - patch
      tests-and-browser:
        applies-to: version-updates
        patterns:
          - playwright
          - '@testing-library/react'
          - '@chialab/vitest-axe'
          - axe-core
        update-types:
          - minor
          - patch
      build-and-lint:
        applies-to: version-updates
        patterns:
          - autoprefixer
          - eslint-plugin-react-hooks
          - eslint-plugin-react-refresh
          - globals
          - prettier
          - tsx
          - typescript-eslint
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
